<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Convite do 1º aninho do Jose Daniel: 23 de janeiro de 2027, Itaguaí, RJ."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Missão 1 Ano do Jose Daniel</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap">
<style id="css">
/* Layout: páginas de gibi em tons de festa — azul bebê, cinza e branco da decoração, com toques de vermelho; contornos marinho suaves e silhueta de cidade. Tema único e claro, escolhido de propósito. */
:root{
  color-scheme: light;
  --blue:#3d7fc9; --blue-2:#a9d1f5; --blue-deep:#2c5f9e; --navy:#1d2f55;
  --red:#d7262f; --red-deep:#a81c24; --white:#ffffff; --paper:#f3f9ff; --sky:#dceefc;
  --gray:#a9b0b9; --gray-2:#d9dee4;
  --gold:#ffc92e; --muted:#45507a; --blush:#ff6b81;
  --green:#1f9d48; --green-2:#3fdc74; --green-deep:#0f5a2a; --green-dark:#072a14; --lime:#7dff9b; --mint:#dcf8e4;
  --baby:#cfe6ff; --baby-2:#a9d1ff; --baby-deep:#6aaef5; --baby-pale:#eef6ff;
  --f-display:"Bangers","Impact","Arial Black",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --line:3px solid var(--navy);
  --pop:5px 5px 0 var(--navy);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--navy);font-family:var(--f-body);font-size:16px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--white)}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dots{background-image:radial-gradient(rgba(61,127,201,.13) 1.3px,transparent 1.7px);background-size:14px 14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;line-height:.95;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-weight:900;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:22px;letter-spacing:.06em;padding:12px 22px;border:var(--line);border-radius:14px;background:var(--red);color:var(--white);text-decoration:none;box-shadow:var(--pop);cursor:pointer;transition:transform .15s,box-shadow .15s;line-height:1}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--navy)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--navy)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.blue{background:var(--blue)}
.btn.white{background:var(--white);color:var(--navy)}
.btn.baby{background:var(--baby-2);color:var(--navy)}
.btn.small{font-size:17px;padding:9px 14px;border-radius:11px;box-shadow:3px 3px 0 var(--navy)}
.btn .arr{font-family:var(--f-body);font-weight:900;font-size:18px}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--white);border-bottom:var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:26px;letter-spacing:.06em;text-decoration:none;white-space:nowrap}
.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--red);color:var(--white);border:var(--line);font-weight:400;font-size:22px}
.logo span{color:var(--blue)}
@media (max-width:520px){.logo span{display:none}}
.nav-links{display:flex;align-items:center;gap:22px;font-weight:800;font-size:15px}
.nav-links a{text-decoration:none}
.nav-links a:not(.btn):hover{color:var(--red)}
.nav .btn{font-size:18px;padding:9px 16px;box-shadow:3px 3px 0 var(--navy)}
@media (max-width:900px){.nav-links a:not(.btn){display:none}}

/* HERO */
.hero{position:relative;overflow:hidden;color:var(--navy);border-bottom:var(--line);
  background:radial-gradient(circle at 72% 46%,#ffffff 0,transparent 46%),repeating-conic-gradient(from 0deg at 72% 46%,#bfdef8 0 8deg,#a9d1f5 8deg 16deg)}
.skyline{position:absolute;left:0;bottom:0;width:100%;height:110px;z-index:0;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.4px,transparent 1.8px);background-size:13px 13px;pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:32px;padding-block:56px 110px}
.hero-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.burst{align-self:flex-start;background:var(--red);color:var(--white);border:var(--line);border-radius:999px;padding:7px 14px;box-shadow:3px 3px 0 var(--navy);transform:rotate(-2deg)}
.tagline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:900;font-size:13px;letter-spacing:.14em}
.tagline .tag{background:var(--white);color:var(--navy);border:var(--line);padding:3px 9px;border-radius:6px;font-family:var(--f-display);font-size:18px;letter-spacing:.08em}
.hero h1{font-size:clamp(44px,6.6vw,84px);color:var(--navy);text-shadow:3px 3px 0 var(--white)}
.hero h1 em{font-style:normal;color:var(--red)}
.name-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.name-big{font-family:var(--f-display);font-size:clamp(56px,8.4vw,112px);line-height:.88;color:var(--red);-webkit-text-stroke:3px var(--white);paint-order:stroke fill;text-shadow:6px 6px 0 var(--navy);letter-spacing:.04em;min-width:0}
.age-pill{font-family:var(--f-display);font-size:28px;background:var(--white);color:var(--red);border:var(--line);border-radius:12px;padding:4px 14px;box-shadow:4px 4px 0 var(--navy);transform:rotate(4deg);margin-bottom:8px}
.hero-lead{font-size:18px;font-weight:700;max-width:30em}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;font-weight:800;font-size:14px}
.hero-meta span{background:var(--white);border:2px solid var(--navy);border-radius:999px;padding:6px 12px}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

.shield-stage{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:460px;width:100%;justify-self:center}
.ring{position:absolute;inset:0;animation:spin 26s linear infinite}
.ring text{font-family:var(--f-display);font-size:19px;letter-spacing:.32em;fill:var(--navy)}
.emblem{position:relative;width:74%;aspect-ratio:1;border-radius:50%;filter:drop-shadow(10px 10px 0 var(--navy));animation:bob 4s ease-in-out infinite;perspective:600px}
.emblem svg{width:100%;height:100%;display:block}
.emblem-name{position:absolute;bottom:3%;left:50%;transform:translateX(-50%) rotate(-3deg);font-family:var(--f-display);font-size:22px;letter-spacing:.06em;background:var(--white);border:var(--line);border-radius:999px;padding:2px 16px;white-space:nowrap;box-shadow:3px 3px 0 var(--navy)}
.spark{position:absolute;color:var(--gold);font-size:30px;animation:twinkle 2.4s ease-in-out infinite}
.spark svg{width:1em;height:1em;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes twinkle{50%{transform:scale(.55) rotate(30deg);opacity:.6}}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:36px 96px}.shield-stage{max-width:320px;grid-row:1}}

/* MARQUEE */
.marquee{background:var(--white);color:var(--navy);border-bottom:var(--line);overflow:hidden;white-space:nowrap}
.marquee-track{display:inline-flex;gap:36px;padding:12px 0;font-family:var(--f-display);font-size:26px;letter-spacing:.08em;animation:marq 26s linear infinite}
.marquee-track i{font-style:normal;color:var(--red)}
@keyframes marq{to{transform:translateX(-50%)}}

/* SECTIONS */
section{position:relative}
.sec{padding-block:80px}
.sec-head{display:flex;flex-direction:column;gap:12px;margin-bottom:34px;max-width:720px}
.sec-head h2{font-size:clamp(44px,6vw,72px)}
.sec-head h2 .r{color:var(--red)}
.sec-head h2 .b{color:var(--blue)}
.sec-head p{font-size:18px;color:var(--muted);font-weight:600;max-width:36em}
.kicker{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;background:var(--navy);color:var(--white);padding:6px 12px;border-radius:8px}

/* COUNTDOWN */
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
.tick{border:var(--line);border-radius:18px;box-shadow:var(--pop);padding:18px 10px 14px;text-align:center;display:flex;flex-direction:column;gap:2px}
.tick:nth-child(1){background:var(--blue-2)}
.tick:nth-child(2){background:var(--white)}
.tick:nth-child(3){background:var(--red);color:var(--white)}
.tick:nth-child(4){background:var(--gray)}
.tick b{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,7vw,78px);line-height:1;font-variant-numeric:tabular-nums}
.tick span{font-weight:900;font-size:12px;letter-spacing:.2em}
.count-note{margin-top:20px;font-weight:800;color:var(--blue-deep)}
@media (max-width:560px){.count{grid-template-columns:repeat(2,1fr)}}

/* HERÓIS */
.herois{border-block:var(--line);overflow:hidden;background:linear-gradient(180deg,#e8f4fe 0,#bfdef8 100%)}
.herois .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding-bottom:30px}
.herois .kicker{background:var(--red)}
.card-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:470px}
.hint{margin-top:18px;font-weight:800;color:var(--blue-deep);display:flex;align-items:center;gap:10px}
.hint i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(215,38,47,.25);animation:pulse 1.6s infinite;font-style:normal}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(215,38,47,0)}}
.card-stage{perspective:1100px;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
.card-arrow{flex:none;width:46px;height:46px;border:var(--line);border-radius:50%;background:var(--white);font-family:var(--f-display);font-size:28px;line-height:1;cursor:pointer;color:var(--navy);box-shadow:3px 3px 0 var(--navy)}
.card-arrow:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--navy)}
.hero-card{--c1:#1f9d48;--c2:#0f5a2a;--acc:#1f9d48;--acc2:#0f5a2a;--tint:#dcf8e4;
  flex:0 1 340px;min-width:0;border:4px solid var(--navy);border-radius:22px;background:var(--white);color:var(--navy);box-shadow:12px 12px 0 var(--acc),0 24px 50px rgba(29,47,85,.25);transform-style:preserve-3d;transition:transform .12s ease-out,box-shadow .3s;overflow:hidden;position:relative}
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--shine-angle,120deg),transparent 30%,rgba(255,255,255,.45) 48%,transparent 62%);mix-blend-mode:soft-light}
.dc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--acc);color:var(--white);padding:10px 14px;border-bottom:var(--line)}
.dc-top h3{font-size:26px;letter-spacing:.05em;-webkit-text-stroke:1px var(--navy);paint-order:stroke fill}
.dc-top span{flex:none;font-family:var(--f-display);font-size:17px;background:var(--white);color:var(--acc2);border:2px solid var(--navy);border-radius:999px;padding:1px 10px}
.dc-art{position:relative;background:repeating-conic-gradient(from 0deg at 50% 45%,var(--c1) 0 10deg,var(--c2) 10deg 20deg);border-bottom:var(--line);aspect-ratio:320/300}
.dc-art svg{position:absolute;left:6%;top:4%;width:88%;height:96%}
.dc-facts{display:grid;gap:6px;padding:12px 14px 16px}
.dc-facts div{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;background:var(--tint)}
.dc-facts span{font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;flex:none}
.dc-facts b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--acc2);text-align:right;line-height:1.05}
.eyes .lid{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (max-width:860px){.herois .wrap{grid-template-columns:1fr}.card-stage{order:-1}}
@media (max-width:420px){.card-arrow{width:36px;height:36px;font-size:22px}.dc-facts b{font-size:17px}}

/* QUANDO / ONDE */
.coords{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{border:var(--line);border-radius:20px;box-shadow:var(--pop);background:var(--white);padding:26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.blue{background:var(--blue-2)}
.panel .label{display:flex;align-items:center;gap:8px}
.panel h3{font-size:clamp(36px,4.6vw,52px)}
.panel p{font-weight:700;font-size:17px}
.panel .btn{align-self:flex-start;margin-top:8px}
@media (max-width:760px){.coords{grid-template-columns:1fr}}

/* PRESENTES */
.gifts-sec{background:var(--white);border-block:var(--line)}
.gift-top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.gift-top .sec-head{margin-bottom:0}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
.gift-count{font-weight:800;color:var(--muted)}
.gift-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.gift{border:var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--paper);box-shadow:4px 4px 0 var(--navy);min-width:0;transition:transform .2s}
.gift:hover{transform:rotate(-1deg) translateY(-3px)}
.gift-ico{width:52px;height:52px;border:var(--line);border-radius:14px;display:grid;place-items:center;background:var(--blue-2);color:var(--navy)}
.gift:nth-child(3n+2) .gift-ico{background:var(--red)}
.gift:nth-child(3n) .gift-ico{background:var(--white);color:var(--red)}
.gift-ico svg{width:30px;height:30px}
.gift h3{font-family:var(--f-body);font-weight:900;font-size:18px;letter-spacing:0;line-height:1.25;overflow-wrap:anywhere}
.gift p{color:var(--muted);font-weight:600;font-size:14px;overflow-wrap:anywhere}
.pill{align-self:flex-start;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--navy);border-radius:999px;padding:3px 10px;background:var(--white)}
.pill.livre{background:var(--sky);color:var(--blue-deep)}
.pill.reservado{background:var(--red);color:var(--white)}
.pill.ganho{background:var(--navy);color:var(--white)}
.gift.ganho{opacity:.62}
.gift.ganho h3{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--red)}
.gift .btn{margin-top:auto;align-self:flex-start}
.gift-empty{border:3px dashed var(--navy);border-radius:18px;padding:28px;text-align:center;font-weight:800;color:var(--muted)}

/* RSVP */
.rsvp .wrap{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:start}
.rule-note{margin-top:20px;background:var(--baby);border:2px solid var(--baby-deep);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;color:var(--navy);max-width:34em}
.again{margin-top:18px;border:var(--line);border-radius:16px;background:var(--sky);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-weight:800}
.form{border:var(--line);border-radius:22px;background:var(--white);box-shadow:10px 10px 0 var(--blue-2);padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.form-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.form-head h3{font-size:34px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{border:var(--line);border-radius:14px;background:var(--paper);padding:14px 10px;font-family:var(--f-display);font-size:20px;letter-spacing:.05em;cursor:pointer;color:var(--navy);transition:transform .15s}
.chip[aria-pressed="true"]{background:var(--blue);color:var(--white);box-shadow:4px 4px 0 var(--navy);transform:translate(-2px,-2px)}
.chip.no[aria-pressed="true"]{background:var(--red)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:900;font-size:14px}
.field small{color:var(--muted);font-weight:600}
input[type=text],input[type=tel],textarea,select{font:inherit;font-weight:700;color:var(--navy);background:var(--paper);border:var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
input.bad{border-color:var(--red);background:#ffe9ec}
.heroes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:4px}
.hero-btn{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--navy);border-radius:14px;background:var(--paper);padding:6px 3px 8px;cursor:pointer;color:var(--navy);font:inherit;font-weight:800;font-size:11.5px;line-height:1.15;text-align:center;transition:transform .15s,background .15s;min-width:0}
.hero-btn svg{width:100%;max-width:64px;height:auto;display:block}
.hero-btn span{overflow-wrap:normal}
.hero-btn:hover{transform:translateY(-2px)}
.hero-btn[aria-pressed="true"]{background:var(--baby);border-width:3px;box-shadow:3px 3px 0 var(--navy);transform:translate(-2px,-2px)}
.hero-chosen{font-weight:800;color:var(--blue);font-size:14px}
@media (max-width:420px){.hero-btn{font-size:9.5px;letter-spacing:-.01em;padding:5px 1px 6px}.heroes{gap:5px}}
.fam{display:flex;flex-direction:column;gap:8px}
.fam-row{display:flex;gap:8px}
.fam-row button{flex:none;width:46px;border:var(--line);border-radius:12px;background:var(--white);font-weight:900;font-size:18px;cursor:pointer;color:var(--red)}
.add{align-self:flex-start;background:none;border:2px dashed var(--blue);color:var(--blue);border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer;font-size:14px}
.form .btn{width:100%;font-size:26px;padding:16px}
.form-foot{text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.err{color:var(--red);font-weight:800;font-size:14px}
@media (max-width:900px){.rsvp .wrap{grid-template-columns:1fr}.form{padding:18px}}

/* FOOTER */
.foot{background:var(--blue-2);color:var(--navy);border-top:var(--line);text-align:center}
.foot .wrap{padding-block:56px;display:flex;flex-direction:column;align-items:center;gap:12px}
.foot h2{font-size:clamp(38px,6vw,64px);color:var(--navy);text-shadow:3px 3px 0 var(--white)}
.foot p{font-weight:800;font-size:18px}
.foot .wrap{position:relative;z-index:1}
.foot{position:relative;overflow:hidden}

/* EFEITOS DE CONFIRMAÇÃO */
.tear{position:fixed;inset:0;z-index:100;pointer-events:none}
.half{position:fixed;inset:0;overflow:hidden;background:var(--paper);will-change:transform}
.half .clone{position:absolute;pointer-events:none}
.half .navclone{position:absolute;left:0;right:0}
.edge{position:absolute;inset:0;width:100%;height:100%}
.glow{position:fixed;inset:0;width:100%;height:100%;z-index:101}
.hands{position:fixed;inset:0;z-index:102;pointer-events:none;will-change:transform}
.hand{position:absolute;will-change:transform;filter:drop-shadow(8px 10px 0 rgba(7,42,20,.55)) drop-shadow(0 0 16px rgba(63,220,116,.7))}
.hand svg{width:100%;height:auto;display:block}
.flash{position:fixed;inset:0;z-index:103;pointer-events:none;background:radial-gradient(circle,transparent 30%,rgba(31,157,72,.6));opacity:0}
.fx-svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fx-flash{position:fixed;inset:0;opacity:0;pointer-events:none}
.fx-dim{position:fixed;inset:0;background:rgba(18,8,38,.9);opacity:0}

      row.appendChild(inp("note", "Detalhe (tamanho, cor…)", "full"));
      var sel = el("select"); sel.id = "a-st-" + g.id; sel.setAttribute("aria-label", "Situação");
      Object.keys(LABEL).forEach(function(k){ var o = el("option", null, LABEL[k]); o.value = k; if (g.status === k) o.selected = true; sel.appendChild(o); });
      sel.addEventListener("change", function(){ g.status = sel.value; });
      row.appendChild(sel);
      row.appendChild(inp("by", "Reservado por (opcional)"));
      var del = el("button", "del", "Remover presente"); del.type = "button";

      row.appendChild(del);

  }
  function openAdmin(){

  }

  $("#adminClose").addEventListener("click", closeAdmin);

  $("#aWa").addEventListener("input", function(){ draft.whatsapp = $("#aWa").value.trim(); });
  $("#aAdd").addEventListener("click", function(){ draft.gifts.push({ id: "g" + Date.now().toString(36), name: "", note: "", status: "livre", by: "" }); adminRows(); var r = $("#aGifts").lastChild; if (r) r.querySelector("input").focus(); });

    var s = $("#aStatus"), b = $("#aSave");

    b.disabled = true; s.className = "status"; s.textContent = "Salvando…";
    art.publish(buildHtml(draft)).then(function(){
      s.className = "status ok"; s.textContent = "Salvo! A página está atualizando para todos.";
    }, function(err){
      b.disabled = false; s.className = "status bad";
      var c = err && err.code;
      if (c === "conflict") s.textContent = "Outra pessoa salvou antes. A página vai recarregar com a versão mais nova; refaça a alteração.";
      else if (c === "not_writer" || c === "not_granted" || c === "consent_required") s.textContent = "Esta conta não tem permissão para editar o convite.";
      else if (c === "rate_limited") s.textContent = "Muitas alterações seguidas. Espere um minutinho e salve de novo.";
      else s.textContent = "Não deu para salvar agora. Tente de novo em instantes.";
    });
  });
  (function tryAdmin(n){
    if (!(window.claude && typeof window.claude.use === "function")) { if (n < 24) setTimeout(function(){ tryAdmin(n + 1); }, 250); return; }
    window.claude.use("user").then(function(user){ return user ? user.canEdit() : false; }).then(function(can){
      if (!can) return null;
      return window.claude.use("artifact");
    }).then(function(a){ if (a) { art = a; $("#adminFab").hidden = false; } }, function(){});
  })(0);
  window.__openAdmin = openAdmin;

  };
  var embI = 0;
  function showEmblem(i){ var id = ORDER[i]; $("#emblem").innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true">' + EMB[id]() + '</svg>'; $("#emblemName").textContent = HEROES[id].name; }
  showEmblem(0);
  setInterval(function(){
    embI = (embI + 1) % ORDER.length;
    var sv = $("#emblem svg");
    if (!sv || !sv.animate) { showEmblem(embI); return; }
    sv.animate([{ transform: "rotateY(0deg)" }, { transform: "rotateY(90deg)" }], { duration: 260, easing: "ease-in", fill: "forwards" }).finished.then(function(){
      showEmblem(embI);
      $("#emblem svg").animate([{ transform: "rotateY(-90deg) scale(.9)" }, { transform: "rotateY(0deg) scale(1)" }], { duration: 440, easing: "cubic-bezier(.2,.9,.3,1.3)" });
    });
  }, 2600);

  /* ---------- card de cada herói ---------- */
  function showHeroCard(id, pop){
    var H = HEROES[id], t = H.t, c = $("#heroCard"), f = FACTS[id];
    ["c1", "c2", "acc", "acc2", "tint"].forEach(function(k){ c.style.setProperty("--" + k, t[k]); });
    c.dataset.hero = id;
    $("#cardName").textContent = H.name;
    $("#cardNo").textContent = "Nº " + ("00" + (ORDER.indexOf(id) + 1)).slice(-3);
    $("#cardArt").innerHTML = id === "doom" ? '<svg viewBox="0 -24 320 364">' + DOOM_ART + '</svg>' : babySVG(id);
    $("#cardArt").setAttribute("aria-label", "Mini " + H.name);
    $("#cardMission").textContent = f[0]; $("#cardWeak").textContent = f[1]; $("#cardEnemy").textContent = f[2];
    each($("#cardTabs").children, function(b){ b.setAttribute("aria-pressed", String(b.dataset.hero === id)); });
    if (pop && Element.prototype.animate) $("#cardArt svg").animate([{ transform: "scale(.6) rotate(-8deg)", opacity: 0 }, { transform: "scale(1.06) rotate(2deg)", opacity: 1, offset: .7 }, { transform: "scale(1) rotate(0)", opacity: 1 }], { duration: 480, easing: "cubic-bezier(.2,.9,.3,1.2)" });
    if (target && !raf) raf = requestAnimationFrame(applyLook);
  }
  ORDER.forEach(function(id){
    var b = el("button", "hero-btn"); b.type = "button"; b.dataset.hero = id;
    b.innerHTML = babySVG(id); b.appendChild(el("span", null, HEROES[id].name));
    b.addEventListener("click", function(){ showHeroCard(id, true); });
    $("#cardTabs").appendChild(b);
  });
  function stepCard(d){ var i = ORDER.indexOf($("#heroCard").dataset.hero || "iron"); showHeroCard(ORDER[(i + d + ORDER.length) % ORDER.length], true); }
  $("#cardPrev").addEventListener("click", function(){ stepCard(-1); });
  $("#cardNext").addEventListener("click", function(){ stepCard(1); });
  showHeroCard("iron", false);
})();
</script>
